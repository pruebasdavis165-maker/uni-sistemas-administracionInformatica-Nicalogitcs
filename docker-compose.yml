services:
  database:
    image: postgres:16-alpine
    container_name: nicalogistics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: NicaLogisticsDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
